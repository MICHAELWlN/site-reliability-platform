# Inactive Linux template; local testing connects directly to Uvicorn on port 8000.
# A future nginx installation would include this file inside its http context.
# This is a basic HTTP example, without TLS, authentication, or production hardening.
server {
    # Accept HTTP on port 80; unlike Uvicorn's loopback binding, this can be external.
    listen 80;
    # Match this host name. This is not an access restriction or a DNS record.
    server_name localhost;

    # Forward requests for all paths, including /health, to the local Python service.
    location / {
        # No replacement URI: preserve the original request path.
        proxy_pass http://127.0.0.1:8000;
        # Tell the application which host the client requested.
        proxy_set_header Host $host;
        # Pass along the address of the client connecting to nginx.
        proxy_set_header X-Real-IP $remote_addr;
        # Append this client's address to the forwarding chain.
        # A future app must trust only configured proxies, not arbitrary client headers.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Tell the application whether the client used HTTP or HTTPS to nginx.
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
